[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "qalam"
description = "Correct, logical-order Arabic text extraction from digitally-born PDFs — without OCR"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pdf", "arabic", "text-extraction", "rtl", "bidi", "unicode"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing",
]
# Filled in from Cargo.toml by maturin.
dynamic = ["version"]

[tool.maturin]
# The crate builds a single native module named `qalam`; there is no
# pure-Python source tree to merge with it.
module-name = "qalam"
features = ["pyo3/extension-module"]
